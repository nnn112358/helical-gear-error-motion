<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歯の並びの誤差</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1+Code:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 24 枚の歯の並び方のずれを、単一ピッチ・累積ピッチ・法線ピッチ・振れの 4 つで、真値と誤差ありで比べる。1 個ずつは小さいずれが積み重なること、偏心は 1 回転で 1 周期の波になることが見えること */
:root {
  --bg: #EEF0F5; --die: #E1E5EE; --ink: #1B2233; --muted: #586178; --line: #C6CCDA;
  --ideal: #0B8466; --err: #C2541A; --warn: #D12F4A;
  --display: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --mono: "M PLUS 1 Code", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141F; --die: #1A2031; --ink: #E8ECF5; --muted: #9AA4BA; --line: #2E3752;
    --ideal: #3CCB9F; --err: #F08A4B; --warn: #FF6B81;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141F; --die: #1A2031; --ink: #E8ECF5; --muted: #9AA4BA; --line: #2E3752;
  --ideal: #3CCB9F; --err: #F08A4B; --warn: #FF6B81;
  color-scheme: dark;
}
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1840px; margin-inline: auto; padding-inline: 20px; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 3.2vw, 2.1rem); line-height: 1.3; margin: 0; text-wrap: balance; }
.lead { margin: 0; font-size: 0.95rem; color: var(--muted); max-width: 70em; }
.spec { margin: 6px 0 0; font-size: 0.95rem; color: var(--muted); }
.spec b.i { color: var(--ideal); } .spec b.e { color: var(--err); }
.points { margin: 10px 0 0; padding-left: 1.6em; font-size: 1.15rem; font-weight: 700; line-height: 1.55; max-width: 60em; }
.points li::marker { font-family: var(--mono); color: var(--err); }
.points em { font-style: normal; color: var(--err); }
.note { font-size: 0.9rem; color: var(--muted); max-width: 70em; }
.note summary { cursor: pointer; font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls button { font: 600 0.875rem var(--mono); color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 8px 16px; cursor: pointer; min-width: 6.5em; }
.controls button:hover { background: var(--die); }
.controls button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 420px)); justify-content: center; gap: 28px 22px; }
@media (max-width: 1000px) { .chips { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); } }
.chip { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chip-name { font-family: var(--display); font-size: 1.7rem; line-height: 1.1; color: var(--ink); }
.chip-tag { font-weight: 700; font-size: 0.95rem; color: var(--muted); }
.chip canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 340 / 520; }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>歯の並びの誤差（歯車 1 周）</h1>
      <p class="spec" id="spec"></p>
      <ol class="points" id="points"></ol>
    </div>
    <div class="controls">
      <button id="playToggle" type="button" aria-pressed="false">一時停止</button>
      <button id="speedToggle" type="button">速さ 1×</button>
      <button id="restart" type="button">最初から</button>
    </div>
  </header>
  <section class="chips" style="--n: 4">
    <div class="chip"><div class="chip-head"><span class="chip-name">単一ピッチ誤差 fpt</span><span class="chip-tag">隣の歯との間隔</span></div><canvas id="cv-fpt" role="img"></canvas></div>
    <div class="chip"><div class="chip-head"><span class="chip-name">累積ピッチ誤差 Fp</span><span class="chip-tag">1 番歯からの位置</span></div><canvas id="cv-Fp" role="img"></canvas></div>
    <div class="chip"><div class="chip-head"><span class="chip-name">法線ピッチ誤差 fpb</span><span class="chip-tag">作用線に沿った間隔</span></div><canvas id="cv-fpb" role="img"></canvas></div>
    <div class="chip"><div class="chip-head"><span class="chip-name">振れ Fr</span><span class="chip-tag">偏心で歯溝がゆれる</span></div><canvas id="cv-Fr" role="img"></canvas></div>
  </section>
  <details class="note"><summary>前提と計算のしかた</summary><p class="lead" id="lead"></p></details>
</main>
<script>

// （d = 基準円直径, mn, b）をそのまま入れ、10 級に換算（×√2^(10-5)）した「目安」。
// 規格は寸法区分の幾何平均と丸めを使うので、表の値とは少し違う。

var TOL = {

  Fp: (0.3 * G.mn + 1.25 * sd + 7) * QF,         // 累積ピッチ誤差
  Fa: (3.2 * sm + 0.22 * sd + 0.7) * QF,         // 全歯形誤差
  ffa: (2.5 * sm + 0.17 * sd + 0.5) * QF,        // 歯形形状誤差
  fHa: (2 * sm + 0.14 * sd + 0.5) * QF,          // 歯形勾配誤差
  Fb: (0.1 * sd + 0.63 * sb + 4.2) * QF,         // 全歯すじ誤差
  ffb: (0.07 * sd + 0.45 * sb + 3) * QF,         // 歯すじ形状誤差（= 勾配誤差の式）

var RA = 3.2;                                    // 歯面粗さ：Ra 3.2 µm を想定（歯切りのまま程度）

function slopeWave(n, H, F, Ftot, cycles, phase) {
  var u = [], e = [], i;
  for (i = 0; i <= n; i++) { u.push(i / n); e.push(F / 2 * Math.sin(2 * Math.PI * cycles * u[i] + phase)); }
  var k0 = lsq(u, e)[0];                          // うねりが持ち込む傾きを差し引き、測った傾きを H にする
  e = e.map(function (v, i) { return v + (H - k0) * (u[i] - 0.5); });
  var sc = Math.min(1, Ftot / range(e));          // 全体（山と谷の差）が全体の許容値を超えないよう縮める
  e = e.map(function (v) { return v * sc; });

// 1. 歯形：歯元（インボリュートの始まり）→ 歯先 を転がり長さで測る
var L0 = Math.sqrt(G.r_form * G.r_form - G.rb * G.rb), L1 = Math.sqrt(G.ra * G.ra - G.rb * G.rb);
var PROF = slopeWave(200, TOL.fHa, TOL.ffa, TOL.Fa, 1.3, 0.5);
// 2. 歯すじ：歯幅 0 → b
var HELIX = slopeWave(200, TOL.ffb, TOL.ffb, TOL.Fb, 1.0, -0.6);
// 3. ピッチ：歯ごとの位置ずれ。乱数（シード固定）で作り、単一ピッチの最大を許容値いっぱいにする
var PITCH = (function () {
  var r = rng(7), f = [], i, m = 0;
  for (i = 0; i < G.z; i++) f.push(r() * 2 - 1);
  var mean = f.reduce(function (a, b) { return a + b; }, 0) / G.z;
  f = f.map(function (v) { return v - mean; });               // 1 周すると元に戻る（合計 0）

  var F = [0]; for (i = 1; i < G.z; i++) F.push(F[i - 1] + f[i]); // 1 番歯を基準にした位置ずれ（累積）

})();

  var n = 800, len = (L1 * L1 - L0 * L0) / (2 * G.rb), r = rng(11), y = [], i, noise = 0;

  // ---------- 共通 ----------

  var T = {};

  var RS = FL.map(function (p) { return Math.hypot(p[0], p[1]); });

    poly(ctx, all); ctx.lineTo(all[all.length - 1][0], 260); ctx.lineTo(all[0][0], 260); ctx.closePath();
    ctx.globalAlpha = 0.16; ctx.fillStyle = T.err; ctx.fill(); ctx.globalAlpha = 1;
    acts.forEach(function (a) { poly(ctx, a); ctx.strokeStyle = T.err; ctx.lineWidth = 2.2; ctx.stroke(); });
    ides.forEach(function (a) { poly(ctx, a); ctx.strokeStyle = T.ideal; ctx.lineWidth = 1.2; ctx.stroke(); });
    // 作用線（基礎円の接線）
    var th = LOA.th, T0 = [G.rb * Math.cos(th), G.rb * Math.sin(th)], d = [-Math.sin(th), Math.cos(th)];
    var l0 = scr([T0[0] - d[0] * 12, T0[1] - d[1] * 12]), l1 = scr([T0[0] + d[0] * 12, T0[1] + d[1] * 12]);
    ctx.strokeStyle = T.ink; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(l0[0], l0[1]); ctx.lineTo(l1[0], l1[1]); ctx.stroke();
    var tp = scr(T0); ctx.beginPath(); ctx.arc(tp[0], tp[1], 2.5, 0, 2 * Math.PI); ctx.fillStyle = T.ink; ctx.fill();
    var hA = flankHit(PA / 2, th), hBi = flankHit(-PA / 2, th), hBa = flankHit(-PA / 2, th, dB);
    function arrow(p, q, color, off) {
      var P = scr(p), Q = scr(q), nx = -(Q[1] - P[1]), ny = Q[0] - P[0], l = Math.hypot(nx, ny); nx = nx / l * off; ny = ny / l * off;
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(P[0] + nx, P[1] + ny); ctx.lineTo(Q[0] + nx, Q[1] + ny); ctx.stroke();
      [P, Q].forEach(function (R) { ctx.beginPath(); ctx.arc(R[0], R[1], 2.6, 0, 2 * Math.PI); ctx.fillStyle = color; ctx.fill(); });
      return [(P[0] + Q[0]) / 2 + nx, (P[1] + Q[1]) / 2 + ny];
    }
    if (hA && hBi) { var mi = arrow(hA.p, hBi.p, T.ideal, -9); tag(ctx, 'pb ' + fx(PB, 3) + ' mm', mi[0] - 4, mi[1] - 9, { size: 9, color: T.ideal, align: 'right' }); }
    if (hA && hBa && g > 0.01) arrow(hA.p, hBa.p, T.err, 9);
    ctx.restore();
    txt(ctx, '細い線：作用線（基礎円の接線）　点線：基礎円', 22, 242, { jp: true, size: 9, color: T.muted, align: 'left' });
    if (t >= T_SWEEP && t < END) txt(ctx, '歯' + (j + 1) + '→' + ((j + 1) % G.z + 1), 318, 44, { jp: true, size: 10, color: T.err, align: 'right' });
    chartFrame(ctx, '歯1→2', '歯' + G.z + '→1', '隣り合う歯の間隔', '作用線に沿った間隔のずれ', t);
    for (var i = 0; i < nb; i++) bar(ctx, i, FPB[i], 0.85);
    var cur = t >= T_SWEEP ? PB + FPB[j] / 1000 : null;
    numbers(ctx, [
      { label: '法線ピッチ誤差 fpb', val: nb ? maxAbs(FPB.slice(0, nb)) : null },
      { label: '法線ピッチ', ideal: fx(PB, 4), val: cur == null ? null : fx(cur, 4) + ' mm' }
    ], 'JIS ' + GRADE + '級の目安  fpb ≤ ±' + fx(TOL.fpb, 1) + ' µm（fpt × cos αt）');
  };

  // 4. 振れ：歯車の中心が回転軸からずれている。上の歯溝に球を入れ、高さの変化を測る
  PANELS.Fr = function (ctx, t) {
    var K = 50, g = grow(t), u = prog(t), rotA = Math.PI / 2 + Math.PI / G.z - 2 * Math.PI * u;  // 歯溝が真上に来る向き
    var n = t >= END ? G.z : t >= T_SWEEP ? Math.min(G.z, Math.floor(u * G.z + 1e-9) + 1) : 0;
    viewFrame(ctx, '歯車全体・上の歯溝に球を入れる', K);
    var ex = K * g * RUN.e / 1000, ca = Math.PI / 2 - 2 * Math.PI * u;
    var cx = ex * Math.cos(ca), cyy = ex * Math.sin(ca);
    var act = gearPts(rotA, null, cx, cyy).map(gScreen), ide = gearPts(rotA, null).map(gScreen);
    poly(ctx, act); ctx.closePath(); ctx.globalAlpha = 0.16; ctx.fillStyle = T.err; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = T.err; ctx.lineWidth = 2; ctx.stroke();
    poly(ctx, ide); ctx.closePath(); ctx.strokeStyle = T.ideal; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.strokeStyle = T.muted; ctx.setLineDash([2, 2]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(GCX, GCY, ex * GS, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(GCX - 6, GCY); ctx.lineTo(GCX + 6, GCY); ctx.moveTo(GCX, GCY - 6); ctx.lineTo(GCX, GCY + 6); ctx.stroke();
    var gc = gScreen([cx, cyy]); ctx.beginPath(); ctx.arc(gc[0], gc[1], 3, 0, 2 * Math.PI); ctx.fillStyle = T.err; ctx.fill();
    txt(ctx, '＋回転軸', GCX + 10, GCY + 16, { jp: true, size: 9, color: T.ink, align: 'left' });
    txt(ctx, '●歯車の中心', GCX + 10, GCY + 29, { jp: true, size: 9, color: T.err, align: 'left' });
    var by = gScreen([0, G.rp + 0.9 + cyy]);
    ctx.strokeStyle = T.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(by[0], by[1]); ctx.lineTo(by[0], 40); ctx.stroke();
    ctx.beginPath(); ctx.arc(by[0], by[1], 1.6 * GS, 0, 2 * Math.PI); ctx.fillStyle = T.ink; ctx.fill();
    txt(ctx, '球', by[0] + 10, 48, { jp: true, size: 9, color: T.ink, align: 'left' });
    chartFrame(ctx, '歯溝 1', '歯溝 ' + G.z, '1 回転', '1回転で1周期の波', t);
    var k;
    if (n > 0) {
      ctx.strokeStyle = T.err; ctx.lineWidth = 2.2; ctx.beginPath();
      for (k = 0; k < n; k++) { if (k) ctx.lineTo(XB(k), cy(RUN.r[k])); else ctx.moveTo(XB(k), cy(RUN.r[k])); }
      ctx.stroke();
      for (k = 0; k < n; k++) { ctx.beginPath(); ctx.arc(XB(k), cy(RUN.r[k]), 2.4, 0, 2 * Math.PI); ctx.fillStyle = T.err; ctx.fill(); }
    }
    numbers(ctx, [
      { label: '振れ Fr', val: n > 1 ? range(RUN.r.slice(0, n)) : null },
      { label: '偏心量 e', val: t >= END ? RUN.e : null }
    ], 'JIS ' + GRADE + '級の目安  Fr ≤ ' + fx(TOL.Fr, 1) + ' µm（振れ ＝ 偏心 × 2）');
  };

  var f1 = function (v) { return fx(v, 1); };
  LEAD = '誤差ありの歯車は、単一ピッチ誤差と振れを JIS ' + GRADE + '級の許容いっぱいにした（JIS B 1702-1:1998 の式に実寸を入れた目安）。' +
    'ピッチの並びは乱数（シード固定）で作った。法線ピッチ誤差は、歯形が理想として fpt × cos αt で求めた。ピッチ誤差と偏心は別々に入れている。';
  POINTS = ['隣どうしの間隔のずれは小さくても（最大 ' + f1(maxAbs(FPT)) + ' µm）、<em>積み重なると大きくなる</em>（' + f1(PITCH.Fp) + ' µm）',
    '中心がずれる（偏心）と、歯の高さが<em>1 回転で 1 周期の波</em>になる（振れ ' + f1(RUN.Fr) + ' µm）'];
  ARIA.fpt = '単一ピッチ誤差：歯車を1回転させ、隣り合う歯の間隔を ' + G.z + ' か所測る。真値はどこも 0。誤差ありはいちばん大きいずれが ' + f1(maxAbs(FPT)) + ' µm。';
  ARIA.Fp = '累積ピッチ誤差：1番歯を基準にした各歯の位置のずれ。単一ピッチ誤差を順に足した線になり、山と谷の差は ' + f1(PITCH.Fp) + ' µm。単一ピッチの最大 ' + f1(maxAbs(FPT)) + ' µm より大きい。真値は 0。';
  ARIA.fpb = '法線ピッチ誤差：隣り合う歯の同じ側の歯面の距離を、基礎円の接線に沿って測る。真値は ' + fx(PB, 3) + ' mm。誤差ありはいちばん大きいずれが ' + f1(maxAbs(FPB)) + ' µm。';
  ARIA.Fr = '振れ：歯車の中心が回転軸から ' + f1(RUN.e) + ' µm ずれていて、歯溝に入れた球の高さが1回転で1周期ゆれる。振れは ' + f1(RUN.Fr) + ' µm。真値は 0。';

  // ---------- 文章（数字は上の計算から） ----------
  document.getElementById('spec').innerHTML =
    'モジュール ' + G.mn + '・' + G.z + ' 歯・ねじれ角 ' + G.beta + '°・歯幅 ' + G.b + ' mm のはすば歯車。' +
    '<b class="i">緑＝真値（誤差 0）</b>　<b class="e">橙＝誤差あり</b>　1 µm ＝ 1/1000 mm（髪の毛の太さは約 70 µm）';
  document.getElementById('points').innerHTML = POINTS.map(function (p) { return '<li>' + p + '</li>'; }).join('');
  document.getElementById('lead').innerHTML = '歯車の形は helical_gear.py の創成歯形。' + (LEAD || '');
  var panels = ORDER.map(function (k) {
    var c = document.getElementById('cv-' + k); c.setAttribute('aria-label', ARIA[k]);
    return { c: c, draw: PANELS[k] };
  });
  var playBtn = document.getElementById('playToggle');
  var speedBtn = document.getElementById('speedToggle');
  var SPEEDS = [1, 0.5, 0.25], LABELS = ['速さ 1×', '速さ 0.5×', '速さ 0.25×'];
  var si = 0;
  window.ANIM_PERIOD = PERIOD;   // 録画スクリプトが1周の長さを読む
  var paused = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var time = paused ? END + 0.1 : 0, last = 0, tokenAge = 1;
  function syncBtn() { playBtn.textContent = paused ? '再生' : '一時停止'; playBtn.setAttribute('aria-pressed', paused ? 'true' : 'false'); }
  playBtn.addEventListener('click', function () { paused = !paused; syncBtn(); });
  speedBtn.addEventListener('click', function () { si = (si + 1) % SPEEDS.length; speedBtn.textContent = LABELS[si]; });
  document.getElementById('restart').addEventListener('click', function () { time = 0; });
  syncBtn();
  function loop(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    tokenAge += dt || 0.016;
    if (tokenAge > 0.4) { readTokens(); tokenAge = 0; }
    if (!paused) time += dt * SPEEDS[si];
    var t = time % PERIOD;
    panels.forEach(function (p) { p.draw(fit(p.c), t); });
    requestAnimationFrame(loop);
  }
  readTokens();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
