<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歯車本体の誤差</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1+Code:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 穴・端面・穴と歯の位置関係という、歯そのものではない部分の誤差を、真値と誤差ありで比べる。穴を基準に回すと、本体の誤差が歯の振れや歯すじの傾きとして出ることを見せる */
:root {
  --bg: #EEF0F5; --die: #E1E5EE; --ink: #1B2233; --muted: #586178; --line: #C6CCDA;
  --ideal: #0B8466; --err: #C2541A; --warn: #D12F4A;
  --display: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --mono: "M PLUS 1 Code", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141F; --die: #1A2031; --ink: #E8ECF5; --muted: #9AA4BA; --line: #2E3752;
    --ideal: #3CCB9F; --err: #F08A4B; --warn: #FF6B81;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141F; --die: #1A2031; --ink: #E8ECF5; --muted: #9AA4BA; --line: #2E3752;
  --ideal: #3CCB9F; --err: #F08A4B; --warn: #FF6B81;
  color-scheme: dark;
}
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1840px; margin-inline: auto; padding-inline: 20px; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; justify-content: space-between; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 3.2vw, 2.1rem); line-height: 1.3; margin: 0; text-wrap: balance; }
.lead { margin: 0; font-size: 0.95rem; color: var(--muted); max-width: 70em; }
.spec { margin: 6px 0 0; font-size: 0.95rem; color: var(--muted); }
.spec b.i { color: var(--ideal); } .spec b.e { color: var(--err); }
.points { margin: 10px 0 0; padding-left: 1.6em; font-size: 1.15rem; font-weight: 700; line-height: 1.55; max-width: 60em; }
.points li::marker { font-family: var(--mono); color: var(--err); }
.points em { font-style: normal; color: var(--err); }
.note { font-size: 0.9rem; color: var(--muted); max-width: 70em; }
.note summary { cursor: pointer; font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls button { font: 600 0.875rem var(--mono); color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 8px 16px; cursor: pointer; min-width: 6.5em; }
.controls button:hover { background: var(--die); }
.controls button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 420px)); justify-content: center; gap: 28px 22px; }
@media (max-width: 1000px) { .chips { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); } }
.chip { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chip-name { font-family: var(--display); font-size: 1.7rem; line-height: 1.1; color: var(--ink); }
.chip-tag { font-weight: 700; font-size: 0.95rem; color: var(--muted); }
.chip canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 340 / 520; }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>歯車本体の誤差</h1>
      <p class="spec" id="spec"></p>
      <ol class="points" id="points"></ol>
    </div>
    <div class="controls">
      <button id="playToggle" type="button" aria-pressed="false">一時停止</button>
      <button id="speedToggle" type="button">速さ 1×</button>
      <button id="restart" type="button">最初から</button>
    </div>
  </header>
  <section class="chips" style="--n: 4">
    <div class="chip"><div class="chip-head"><span class="chip-name">穴の寸法</span><span class="chip-tag">穴が大きすぎる</span></div><canvas id="cv-bore" role="img"></canvas></div>
    <div class="chip"><div class="chip-head"><span class="chip-name">穴の真円度</span><span class="chip-tag">穴がまるくない</span></div><canvas id="cv-round" role="img"></canvas></div>
    <div class="chip"><div class="chip-head"><span class="chip-name">端面の振れ</span><span class="chip-tag">取付け面の傾き</span></div><canvas id="cv-face" role="img"></canvas></div>
    <div class="chip"><div class="chip-head"><span class="chip-name">穴と歯の同軸度</span><span class="chip-tag">中心のずれ</span></div><canvas id="cv-coax" role="img"></canvas></div>
  </section>
  <details class="note"><summary>前提と計算のしかた</summary><p class="lead" id="lead"></p></details>
</main>
<script>

// 規格は寸法区分の幾何平均と丸めを使うので、表の値とは少し違う。

  Fp: (0.3 * G.mn + 1.25 * sd + 7) * QF,         // 累積ピッチ誤差
  Fa: (3.2 * sm + 0.22 * sd + 0.7) * QF,         // 全歯形誤差
  ffa: (2.5 * sm + 0.17 * sd + 0.5) * QF,        // 歯形形状誤差
  fHa: (2 * sm + 0.14 * sd + 0.5) * QF,          // 歯形勾配誤差

  ffb: (0.07 * sd + 0.45 * sb + 3) * QF,         // 歯すじ形状誤差（= 勾配誤差の式）

var RA = 3.2;                                    // 歯面粗さ：Ra 3.2 µm を想定（歯切りのまま程度）

function slopeWave(n, H, F, Ftot, cycles, phase) {
  var u = [], e = [], i;
  for (i = 0; i <= n; i++) { u.push(i / n); e.push(F / 2 * Math.sin(2 * Math.PI * cycles * u[i] + phase)); }
  var k0 = lsq(u, e)[0];                          // うねりが持ち込む傾きを差し引き、測った傾きを H にする
  e = e.map(function (v, i) { return v + (H - k0) * (u[i] - 0.5); });
  var sc = Math.min(1, Ftot / range(e));          // 全体（山と谷の差）が全体の許容値を超えないよう縮める
  e = e.map(function (v) { return v * sc; });

// 1. 歯形：歯元（インボリュートの始まり）→ 歯先 を転がり長さで測る

// 2. 歯すじ：歯幅 0 → b
var HELIX = slopeWave(200, TOL.ffb, TOL.ffb, TOL.Fb, 1.0, -0.6);
// 3. ピッチ：歯ごとの位置ずれ。乱数（シード固定）で作り、単一ピッチの最大を許容値いっぱいにする

  var r = rng(7), f = [], i, m = 0;
  for (i = 0; i < G.z; i++) f.push(r() * 2 - 1);
  var mean = f.reduce(function (a, b) { return a + b; }, 0) / G.z;
  f = f.map(function (v) { return v - mean; });               // 1 周すると元に戻る（合計 0）

  var F = [0]; for (i = 1; i < G.z; i++) F.push(F[i - 1] + f[i]); // 1 番歯を基準にした位置ずれ（累積）

})();

})();

  var n = 800, len = (L1 * L1 - L0 * L0) / (2 * G.rb), r = rng(11), y = [], i, noise = 0;

  // ---------- 共通 ----------

  var T = {};

    cross(ctx, GCX6, GCY6);
    var gc = g6Screen([cx, cyy]); ctx.beginPath(); ctx.arc(gc[0], gc[1], 3, 0, 2 * Math.PI); ctx.fillStyle = T.err; ctx.fill();
    txt(ctx, '＋穴の中心＝回転軸', GCX6, GCY6 + 30, { jp: true, size: 9, color: T.ink });
    txt(ctx, '●歯の中心', GCX6, GCY6 + 43, { jp: true, size: 9, color: T.err });
    var by = g6Screen([0, G.rp + 0.9 + cyy]);
    ctx.strokeStyle = T.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(by[0], by[1]); ctx.lineTo(by[0], 40); ctx.stroke();
    ctx.beginPath(); ctx.arc(by[0], by[1], 1.6 * GS6, 0, 2 * Math.PI); ctx.fillStyle = T.ink; ctx.fill();
    txt(ctx, '球', by[0] + 10, 48, { jp: true, size: 9, color: T.ink, align: 'left' });
    chartFrame(ctx, '歯溝 1', '歯溝 ' + G.z, '1 回転', '1回転で1周期の波', t);
    var X = function (k) { return CX0 + 6 + k / (G.z - 1) * (CX1 - CX0 - 12); }, k;
    if (n > 0) {
      ctx.strokeStyle = T.err; ctx.lineWidth = 2.2; ctx.beginPath();
      for (k = 0; k < n; k++) { if (k) ctx.lineTo(X(k), cy(COAX.r[k])); else ctx.moveTo(X(k), cy(COAX.r[k])); }
      ctx.stroke();
      for (k = 0; k < n; k++) { ctx.beginPath(); ctx.arc(X(k), cy(COAX.r[k]), 2.4, 0, 2 * Math.PI); ctx.fillStyle = T.err; ctx.fill(); }
    }
    numbers(ctx, [
      { label: '中心のずれ', val: t >= END ? OFF : null },
      { label: '歯の振れ', val: n > 1 ? range(COAX.r.slice(0, n)) : null }
    ], '想定  穴と歯の中心が ' + OFF + ' µm ずれる。振れ ＝ ずれ × 2');
  };

  var f1 = function (v) { return fx(v, 1); };
  LEAD = '歯そのものではなく、穴や端面の誤差。規格に許容値が無いものは値を想定した（各パネルの下に記載）。';
  POINTS = ['歯ではなく、<em>穴や取付け面</em>の誤差',
    '穴を基準に回すので、本体の誤差は<em>歯の振れ</em>（' + f1(COAX.Fr) + ' µm）や<em>歯すじのずれ</em>（' + f1(FACE.helix) + ' µm）として出る'];
  ARIA.bore = '穴の寸法：真値は直径 10.000 mm。誤差ありは ' + fx(BORE + DBORE / 1000, 3) + ' mm で、1 周どこで測っても ' + DBORE + ' µm 大きい。φ10 H7 の上限 +' + H7_UP + ' µm を超え、φ10.000 の軸との間に ' + DBORE + ' µm のすき間ができる。';
  ARIA.round = '穴の真円度：真値は真円。誤差ありは 1 周に 3 つの山があるおむすび形で、半径の山と谷の差（真円度）は ' + f1(ROUND.val) + ' µm。';
  ARIA.face = '端面の振れ：取付け端面が回転軸に対して傾いている。半径 ' + RF + ' mm にダイヤルゲージを当てて 1 回転させると、軸方向に ' + f1(FACE.val) + ' µm ゆれる。真値は 0。この傾きで、歯幅の両端で歯すじが最大 ' + f1(FACE.helix) + ' µm ずれる。';
  ARIA.coax = '穴と歯の同軸度：穴の中心と歯の中心が ' + OFF + ' µm ずれている。穴を軸にして回すと、歯溝に入れた球の高さが 1 回転で 1 周期ゆれ、歯の振れは ' + f1(COAX.Fr) + ' µm（ずれの 2 倍）。真値は 0。';

  // ---------- 文章（数字は上の計算から） ----------
  document.getElementById('spec').innerHTML =
    'モジュール ' + G.mn + '・' + G.z + ' 歯・ねじれ角 ' + G.beta + '°・歯幅 ' + G.b + ' mm のはすば歯車。' +
    '<b class="i">緑＝真値（誤差 0）</b>　<b class="e">橙＝誤差あり</b>　1 µm ＝ 1/1000 mm（髪の毛の太さは約 70 µm）';
  document.getElementById('points').innerHTML = POINTS.map(function (p) { return '<li>' + p + '</li>'; }).join('');
  document.getElementById('lead').innerHTML = '歯車の形は helical_gear.py の創成歯形。' + (LEAD || '');
  var panels = ORDER.map(function (k) {
    var c = document.getElementById('cv-' + k); c.setAttribute('aria-label', ARIA[k]);
    return { c: c, draw: PANELS[k] };
  });
  var playBtn = document.getElementById('playToggle');
  var speedBtn = document.getElementById('speedToggle');
  var SPEEDS = [1, 0.5, 0.25], LABELS = ['速さ 1×', '速さ 0.5×', '速さ 0.25×'];
  var si = 0;
  window.ANIM_PERIOD = PERIOD;   // 録画スクリプトが1周の長さを読む
  var paused = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var time = paused ? END + 0.1 : 0, last = 0, tokenAge = 1;
  function syncBtn() { playBtn.textContent = paused ? '再生' : '一時停止'; playBtn.setAttribute('aria-pressed', paused ? 'true' : 'false'); }
  playBtn.addEventListener('click', function () { paused = !paused; syncBtn(); });
  speedBtn.addEventListener('click', function () { si = (si + 1) % SPEEDS.length; speedBtn.textContent = LABELS[si]; });
  document.getElementById('restart').addEventListener('click', function () { time = 0; });
  syncBtn();
  function loop(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    tokenAge += dt || 0.016;
    if (tokenAge > 0.4) { readTokens(); tokenAge = 0; }
    if (!paused) time += dt * SPEEDS[si];
    var t = time % PERIOD;
    panels.forEach(function (p) { p.draw(fit(p.c), t); });
    requestAnimationFrame(loop);
  }
  readTokens();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
